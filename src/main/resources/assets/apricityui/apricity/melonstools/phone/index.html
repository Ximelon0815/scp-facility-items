  border-radius: 4px;
}

.head-btn:hover {
  border-color: var(--c-red-line);
  color: var(--c-ink);
}

/* 难点: 禁用态用 CSS :disabled 控制, 不要在 JS 里动态 setStyle opacity。
   AUI 对运行期 opacity<1 会触发离屏合成(FilterPushNode)+绘制队列 REORDER,
   实测点击刷新后按钮消失。静态 CSS opacity 走可靠渲染路径, 不会消失。 */
.head-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.page-content {
  flex: 1;
  min-height: 0;
  /* 难点: AUI 的 flex column 子元素不 stretch 到父宽(实测保持内容宽 750 超出平板),
     width:100% 与 align-self:stretch 都不生效。显式设宽 = page 宽(750-侧边栏59=691),
     必须 box-sizing:border-box 让总宽含 padding = 691, 否则 content-box 723 超平板。 */
  width: 691px;
  box-sizing: border-box;
  align-self: stretch;
  padding: 18px 22px 22px;
  /* 难点: AUI 滚动条由引擎自绘, overflow-y: auto/scroll 才显示, 且无 CSS 属性可隐藏。
     改 hidden: 滚动条消失, 滚动由 Java 侧 PhoneScrollController 接管(引擎 setScrollTop 缓动)
     (它直接调 setScrollTop, 不依赖引擎 overflow 滚动判定)。 */
  overflow-y: hidden;
  overflow-x: hidden;
}

/* 隐藏滚动条(内容仍可滚动) */
.page-content::-webkit-scrollbar,
.chat-messages::-webkit-scrollbar,
.chat-members::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}

.page-hint {
  margin: 0 0 14px;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--c-faint);
}

/* ---- 主屏(仪表盘布局,一屏显示不滚动) ---- */
#page-home {
  /* 四角取景框占 8~24px 角落区, 内容内缩到 24px 内侧, 避免盖住边角 */
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
  position: relative;
}

/* ---- 主页背景装饰(科技感水印/取景框/网格线) ---- */
.home-bg {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 0;
}

/* 大三角水印(从 330px 缩小到 220px, 规避超大符号渲染卡顿风险) */
.bg-symbol {
  position: absolute;
  right: 64px;
  bottom: 2px;
  font-size: 220px;
  line-height: 1;
  color: var(--c-red);
  opacity: 0.12;
  user-select: none;
}

/* 四角取景框标记 */
.bg-corner {
  position: absolute;
  width: 16px;
  height: 16px;
  opacity: 0.4;
}
.bg-corner-tl { top: 8px; left: 8px; border-top: 1px solid var(--c-red-line); border-left: 1px solid var(--c-red-line); }
.bg-corner-tr { top: 8px; right: 8px; border-top: 1px solid var(--c-red-line); border-right: 1px solid var(--c-red-line); }
.bg-corner-bl { bottom: 8px; left: 8px; border-bottom: 1px solid var(--c-red-line); border-left: 1px solid var(--c-red-line); }
.bg-corner-br { bottom: 8px; right: 8px; border-bottom: 1px solid var(--c-red-line); border-right: 1px solid var(--c-red-line); }

/* 网格细线 */
.bg-line {
  position: absolute;
  background: var(--c-line);
  opacity: 0.35;
}
.bg-line-v {
  top: 0;
  bottom: 0;
  width: 1px;
}
.bg-line-v-1 { left: 12.5%; }
.bg-line-v-2 { left: 25%; }
.bg-line-v-3 { left: 37.5%; }
.bg-line-v-4 { left: 50%; }
.bg-line-v-5 { left: 62.5%; }
.bg-line-v-6 { left: 75%; }
.bg-line-v-7 { left: 87.5%; }
.bg-line-h {
  left: 0;
  right: 0;
  height: 1px;
}
.bg-line-h-1 { top: 20%; }
.bg-line-h-2 { top: 40%; }
.bg-line-h-3 { top: 60%; }
.bg-line-h-4 { top: 80%; }

/* 内容层在装饰之上 */
.home-top,
.home-important {
  position: relative;
  z-index: 1;
}

/* 顶部:左右分栏(占主体) */
.home-top {
  display: flex;
  gap: 28px;
  flex: 1;
  min-height: 0;
  align-items: stretch;
}

/* 左列:时钟/日期/统计 */
.home-left {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
}

.home-time {
  font-size: 74px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--c-ink);
  font-variant-numeric: tabular-nums;
}

.home-stats {
  display: flex;
  gap: 28px;
  margin-top: 26px;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.stat-num {
  font-size: 26px;
  font-weight: 600;
  color: var(--c-ink);
  font-variant-numeric: tabular-nums;
}

.stat-label {
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--c-faint);
}

/* 今日任务卡片(带进度条) */
.stat-task {
  flex: 1;
  max-width: 320px;
}

.stat-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.stat-track {
  height: 7px;
  background: #3b3b3e;
  overflow: hidden;
  margin-top: 12px;
  border-radius: 4px;
}

.stat-fill {
  height: 100%;
  background: var(--c-red);
}

.stat-hint {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--c-faint);
  margin-top: 8px;
}

/* 右侧身份栏(右上角,贴合内容) */
.home-side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-self: flex-start;
  width: 230px;
  flex-shrink: 0;
}

/* 玩家数据卡(同一框内:ID/部门/职位/余额) */
.home-player-card {
  border: 1px solid var(--c-line);
  background: #2c2c2f;
  padding: 12px 18px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.player-position {
  font-size: 14px;
  letter-spacing: 0.14em;
  color: var(--c-ink);
}

.player-card-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 3px;
}

.player-shape {
  font-size: 26px;
  line-height: 1;
  color: var(--c-red);
}

.player-kicker {
  font-size: 7px;
  letter-spacing: 0.32em;
  color: var(--c-faint);
}

.player-id {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--c-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-dept {
  font-size: 12px;
  letter-spacing: 0.14em;
  color: var(--c-ink);
}

.player-balance {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--c-ink);
}

.player-divider {
  width: 100%;
  height: 1px;
  background: var(--c-line);
  margin: 3px 0;
}

/* 重要消息 */
.home-important {
  flex: 0 0 auto;
}

.imp-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.imp-kicker {
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--c-faint);
}

.imp-title {
  font-size: 12px;
  letter-spacing: 0.14em;
  color: var(--c-muted);
}

.imp-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.imp-empty {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--c-faint);
  padding: 8px 0;
}

/* 底部 */
.home-kicker {
  flex: 0 0 auto;
  font-size: 9px;
  letter-spacing: 0.38em;
  color: var(--c-faint);
  text-align: center;
}

/* 重要消息 @ 图标 */
.imp-icon {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  background: var(--c-red-soft);
  border: 1px solid var(--c-red-line);
  color: var(--c-red);
  font-size: 10px;
  line-height: 16px;
  text-align: center;
}

.imp-item {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--c-line);
  border-left: 2px solid var(--c-red);
  background: rgba(22, 22, 29, 0.35);
  padding: 6px 12px;
  cursor: pointer;
}

.imp-item:hover {
  border-color: var(--c-line-2);
  background: var(--c-panel);
}
.imp-item.notice-pinned {
  border-left-width: 4px;
  border-color: var(--c-red-line);
  background: linear-gradient(90deg, rgba(180, 45, 45, 0.18), rgba(22, 22, 29, 0.35));
}
.imp-item.notice-pinned .imp-icon {
  background: var(--c-red);
  color: #fff;
}

.imp-room {
  flex: 0 0 auto;
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--c-red);
}

.imp-content {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--c-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.imp-time {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--c-faint);
}

.imp-dot {
  flex: 0 0 auto;
  width: 6px;
  height: 6px;
  background: var(--c-red);
  border-radius: 50%;
}

/* ---- 通用标签 ---- */
.ctrl-tag {
  display: inline-block;
  min-width: 20px;
  padding: 1px 7px;
  border: 1px solid var(--c-line-2);
  color: var(--c-muted);
  font-size: 10px;
  line-height: 16px;
  text-align: center;
  border-radius: 3px;
}

.ctrl-tag-red {
  border-color: var(--c-red-line);
  color: var(--c-red);
}


/* ---- 通讯板块 tab ---- */
.comm-tabs {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.comm-tab {
  border: 1px solid var(--c-line);
  background: transparent;
  color: var(--c-muted);
  font-size: 10px;
  letter-spacing: 0.14em;
  padding: 6px 14px;
  cursor: pointer;
  border-radius: 4px;
}

.comm-tab:hover {
  color: var(--c-ink);
}

.comm-tab-active {
  border-color: var(--c-line-2);
  background: var(--c-panel);
  color: var(--c-ink);
}

.comm-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}

.comm-panel-hidden {
  display: none;
}

.panel-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.panel-kicker {
  font-size: 9px;
  letter-spacing: 0.34em;
  color: var(--c-faint);
}

.section {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}

.section-hidden {
  display: none;
}

.section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--c-muted);
}

/* ---- 列表与条目 ---- */
.ctrl-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}

.phone-list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--c-line);
  background: var(--c-panel);
  padding: 10px 14px;
  min-width: 0;
}

.room-item {
  cursor: pointer;
}

.room-item:hover,
.friend-item:hover {
  border-color: var(--c-line-2);
  background: var(--c-panel-2);
}

.friend-item {
  cursor: pointer;
}

.item-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.item-name {
  font-size: 13px;
  letter-spacing: 0.06em;
  color: var(--c-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-sub {
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--c-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.empty-tip {
  padding: 22px 0;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--c-faint);
  text-align: center;
}

/* ---- 头像 ---- */
.avatar {
  position: relative;
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border: 1px solid var(--c-line-2);
  background: var(--c-panel-2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 6px;
}

.avatar-gold { border-color: rgba(179, 18, 18, 0.55); }
.avatar-green { border-color: rgba(120, 160, 120, 0.5); }

.avatar-text {
  font-size: 15px;
  color: var(--c-ink);
  user-select: none;
}

.avatar-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* AUI <texture> 扩展元素(头像/物品图标):必须给宽高,引擎才渲染 */
.avatar texture,
.avatar-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ---- 小按钮 ---- */
.mini-btn {
  border: 1px solid var(--c-line-2);
  background: transparent;
  color: var(--c-muted);
  font-size: 10px;
  letter-spacing: 0.12em;
  padding: 5px 12px;
  cursor: pointer;
  border-radius: 4px;
}

.mini-btn:hover { border-color: var(--c-ink); color: var(--c-ink); }

.mini-btn-ok {
  border-color: rgba(120, 160, 120, 0.5);
  color: #8fb28f;
}

.mini-btn-ok:hover {
  border-color: #9fbf9f;
  color: #bcd6bc;
}

.mini-btn-no {
  border-color: var(--c-line-2);
  color: var(--c-muted);
}

.mini-btn-danger {
  border-color: var(--c-red-line);
  color: var(--c-red);
}

.mini-btn-danger:hover {
  background: var(--c-red-soft);
  color: #e06a70;
}

/* ---- 徽标 ---- */
.badge {
  flex: 0 0 auto;
  min-width: 20px;
  padding: 2px 8px;
  border: 1px solid var(--c-line-2);
  color: var(--c-muted);
  font-size: 10px;
  text-align: center;
  border-radius: 3px;
}

.badge-danger {
  border-color: var(--c-red-line);
  color: var(--c-red);
}

.badge-success {
  color: #9fbf8f;
  border-color: #4a5a42;
}


/* ---- 聊天页 ---- */
/* 难点: AUI 的 flex-grow 不生效, 与其他页面同理(.page-content 固定宽 691px)。
   聊天页不能依赖 flex:1 拉伸, 必须给各层显式固定宽, 否则整页收缩到内容宽(游戏内 213px), 右侧空出大片空白。 */
#page-chat {
  width: 691px;
  box-sizing: border-box;
  align-self: stretch;
}

.chat-main {
  flex: 1;
  min-height: 0;
  display: flex;
  width: 691px;
  box-sizing: border-box;
}

.chat-messages {
  flex: 1;
  min-width: 0;
  padding: 16px 22px;
  /* 滚动条隐藏同 .page-content: overflow-y hidden + Java 侧滚动接管 */
  overflow-y: hidden;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 76%;
}

.msg-row-mine {
  align-self: flex-end;
  align-items: flex-end;
}

.msg-row-other {
  align-self: flex-start;
  align-items: flex-start;
}

.msg-meta {
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--c-faint);
}

.msg-bubble {
  border: 1px solid var(--c-line-2);
  background: var(--c-panel);
  padding: 8px 12px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--c-ink);
  word-break: break-word;
  border-radius: 8px;
}

.msg-row-mine .msg-bubble {
  border-color: var(--c-red-line);
  background: var(--c-red-soft);
}

/* ---- 成员栏 ---- */
.chat-members {
  flex: 0 0 200px;
  width: 200px;
  border-left: 1px solid var(--c-line);
  padding: 14px;
  /* 滚动条隐藏同 .page-content */
  overflow-y: hidden;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chat-members-hidden {
  display: none;
}

.members-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--c-muted);
  margin-bottom: 4px;
}

.member-invite {
  margin-left: auto;
  border: 1px solid var(--c-line-2);
  background: transparent;
  color: var(--c-muted);
  font-size: 10px;
  letter-spacing: 0.1em;
  padding: 3px 10px;
  cursor: pointer;
}

.member-invite:hover { color: var(--c-ink); border-color: var(--c-ink); }

.member-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border: 1px solid var(--c-line);
  background: var(--c-panel);
}

.member-name {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--c-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.member-owner {
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--c-red);
  border: 1px solid var(--c-red-line);
  padding: 1px 6px;
}

.member-kick {
  border: 0;
  background: transparent;
  color: var(--c-faint);
  font-size: 10px;
  letter-spacing: 0.08em;
  cursor: pointer;
  padding: 2px 4px;
}

.member-kick:hover { color: var(--c-red); }

/* ---- 聊天输入栏 ---- */
.chat-inputbar {
  flex: 0 0 auto;
  display: flex;
  border-top: 1px solid var(--c-line);
  padding: 12px 22px;
  gap: 10px;
  width: 691px;
  box-sizing: border-box;
}

.chat-input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--c-line-2);
  background: rgba(12, 12, 15, 0.6);
  color: var(--c-ink);
  font-size: 13px;
  padding: 9px 12px;
}

.chat-input:focus {
  outline: none;
  border-color: var(--c-red);
}

.chat-send {
  border: 1px solid var(--c-red);
  background: var(--c-red);
  color: #fff;
  font-size: 12px;
  letter-spacing: 0.2em;
  padding: 0 22px;
  cursor: pointer;
}

.chat-send:hover { background: #991010; border-color: #991010; }


/* ---- 部门页 ---- */
.dept-badge {
  flex: 0 0 auto;
  border: 1px solid var(--c-red-line);
  color: var(--c-red);
  font-size: 12px;
  letter-spacing: 0.16em;
  padding: 6px 16px;
}

.dept-intro {
  border-left: 2px solid var(--c-red);
  padding: 4px 0 4px 16px;
  margin-bottom: 20px;
}

.dept-intro-kicker {
  font-size: 9px;
  letter-spacing: 0.34em;
  color: var(--c-faint);
  margin-bottom: 6px;
}

.dept-intro-text {
  font-size: 13px;
  line-height: 1.6;
  color: var(--c-muted);
}

.dept-section-head {
  margin: 8px 0 4px;
}

.dept-request {
  border: 1px solid var(--c-line);
  background: var(--c-panel);
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}

.dept-extend {
  margin-top: 8px;
  padding: 18px 0;
  border: 1px dashed var(--c-line-2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.dept-extend-hint {
  font-size: 10px;
  letter-spacing: 0.24em;
  color: var(--c-faint);
}

/* ---- 工作日志 ---- */
.log-date {
  flex: 0 0 auto;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--c-muted);
}

.log-overview {
  border: 1px solid var(--c-line);
  background: var(--c-panel);
  padding: 16px 20px;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.log-overview-text {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.log-kicker {
  font-size: 9px;
  letter-spacing: 0.34em;
  color: var(--c-faint);
}

.log-progress-num {
  font-size: 20px;
  font-weight: 600;
  color: var(--c-ink);
  font-variant-numeric: tabular-nums;
}

.log-progress-track {
  height: 4px;
  background: var(--c-line);
  overflow: hidden;
}

.log-progress-fill {
  height: 100%;
  background: var(--c-red);
  width: 0%;
  transition: width 0.3s;
}

.log-refresh-hint {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--c-faint);
}

/* ---- 任务卡片 ---- */
.task-card {
  border: 1px solid var(--c-line);
  background: var(--c-panel);
  padding: 14px 18px;
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.task-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.task-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--c-ink);
}

.task-state {
  flex: 0 0 auto;
  border: 1px solid var(--c-line-2);
  color: var(--c-muted);
  font-size: 10px;
  letter-spacing: 0.1em;
  padding: 3px 10px;
}

.task-state-claimable {
  border-color: #9fbf9f;
  color: #9fbf9f;
}

.task-state-claimed {
  border-color: var(--c-line-2);
  color: var(--c-faint);
}

.task-desc {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--c-faint);
}

.task-progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.task-track {
  flex: 1;
  height: 4px;
  background: var(--c-line);
  overflow: hidden;
}

.task-fill {
  height: 100%;
  background: var(--c-red);
  width: 0%;
}

.task-count {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--c-muted);
  font-variant-numeric: tabular-nums;
}

.task-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.task-reward {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--c-red);
}

/* ---- 娱乐页 ---- */
/* 难点: AUI 对 fr 均分失效(实测 1fr 1fr 每列都占满容器全宽 750px, 卡片溢出)。
   必须用固定像素列。AUI 的 justify-content:center 对 grid 不生效,
   用固定宽度 + margin:0 auto 居中消除右侧空白。 */
.game-grid {
  display: grid;
  grid-template-columns: 315px 315px;
  gap: 14px;
  width: 644px;
  margin: 0 auto;
}

.game-card {
  border: 1px solid var(--c-line);
  background: var(--c-panel);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}

.game-card:hover {
  border-color: var(--c-red-line);
  background: var(--c-panel-2);
}

.game-card-disabled {
  opacity: 0.4;
  cursor: default;
}

.game-glyph {
  flex: 0 0 46px;
  width: 46px;
  height: 46px;
  border: 1px solid var(--c-line-2);
  color: var(--c-red);
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.game-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.game-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--c-ink);
}

.game-desc {
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--c-faint);
}


/* ---- 游戏页 ---- */
.diff-tabs {
  display: flex;
  gap: 6px;
  padding: 10px 22px 0;
  border-bottom: 1px solid var(--c-line);
}

.diff-tab {
  border: 1px solid var(--c-line);
  border-bottom: 0;
  background: transparent;
  color: var(--c-muted);
  font-size: 11px;
  letter-spacing: 0.14em;
  padding: 7px 18px;
  cursor: pointer;
}

.diff-tab:hover { color: var(--c-ink); }

.diff-tab-active {
  border-color: var(--c-line-2);
  background: var(--c-panel);
  color: var(--c-ink);
}

.game-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: hidden;
}

/* 难点: AUI 的 max-width 可能不生效(实测 750px 全宽), 用固定宽度 + margin:0 auto 居中 */
.game-bar {
  width: 560px;
  margin: 0 auto 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

.game-stat {
  font-size: 12px;
  letter-spacing: 0.14em;
  color: var(--c-muted);
  font-variant-numeric: tabular-nums;
}

.game-hint {
  margin: 12px auto 20px;
  width: 560px;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--c-faint);
  text-align: center;
}

.game-result {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--c-muted);
}

.game-result-win {
  color: #9fbf9f;
}

.game-result-lose {
  color: var(--c-red);
}

/* ---- 扫雷 ---- */
/* 难点: AUI 不支持 max-content/fr/justify-content:center/父容器 align-items:center。
   用固定容器宽度(=轨道总宽) + margin:0 auto 居中(AUI 支持 margin auto)。
   宽度 = 列数×格子 + (列数-1)×gap。 */
.ms-grid {
  display: grid;
  gap: 2px;
}

.ms-8  { grid-template-columns: repeat(8, 27px); width: 230px; margin: 0 auto; }
.ms-12 { grid-template-columns: repeat(12, 22px); width: 286px; margin: 0 auto; }
.ms-24 { grid-template-columns: repeat(24, 23px); width: 598px; margin: 0 auto; }

/* 难点: AUI 里 grid 项的 width:100% 不会被轨道约束(实测格子占满容器 358px 而非 28px)。
   必须移除 width, 让格子宽度由 grid-template-columns 轨道决定, aspect-ratio:1 保持正方形。 */
.ms-cell {
  aspect-ratio: 1;
  border: 1px solid var(--c-line-2);
  background: var(--c-panel-2);
  color: var(--c-ink);
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  box-sizing: border-box;
}

.ms-cell:hover { border-color: var(--c-ink); }

.ms-cell-open {
  background: rgba(10, 10, 13, 0.8);
  cursor: default;
}

.ms-cell-mine {
  color: var(--c-red);
  background: var(--c-red-soft);
}

.ms-cell-flag {
  color: var(--c-red);
}

.ms-cell-n1 { color: #9fbf9f; }
.ms-cell-n2 { color: #d9c47f; }
.ms-cell-n3 { color: #e08a6a; }
.ms-cell-n4 { color: var(--c-red); }

/* ---- 记忆翻牌 ---- */
/* 难点: 与扫雷同理, 网格高度不能超出游戏外框。
   6 行时可用高度约 260px: 6行×36px + 5×8gap = 256px(逻辑)。
   4 行时格子可大些: 4行×58px + 3×8gap = 256px。
   宽度 = 列数×格子 + (列数-1)×gap, 固定后 margin auto 居中。 */
.mm-grid {
  display: grid;
  gap: 8px;
  justify-content: center;
}

.mm-4 { grid-template-columns: repeat(4, 58px); width: 256px; margin: 0 auto; }
.mm-5 { grid-template-columns: repeat(5, 46px); width: 262px; margin: 0 auto; }
.mm-6 { grid-template-columns: repeat(6, 36px); width: 256px; margin: 0 auto; }
.mm-8 { grid-template-columns: repeat(8, 36px); width: 344px; margin: 0 auto; }

.mm-card {
  aspect-ratio: 1;
  border: 1px solid var(--c-line-2);
  background: var(--c-panel-2);
  color: var(--c-ink);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  box-sizing: border-box;
}

.mm-card:hover { border-color: var(--c-ink); }

.mm-card-flipped {
  border-color: var(--c-red-line);
  background: var(--c-red-soft);
}

.mm-card-done {
  border-color: #4a6a4a;
  background: rgba(90, 130, 90, 0.15);
}

/* ---- 2048 ---- */
/* 难点: 与扫雷同理, 网格+底部hint的总高度不能超出游戏外框。
   实测: 网格自身需留出下方 game-hint(约30px)的空间,
   6行×32px + 5×6gap + padding12 = 234px; 5行39px→231px; 4行50px→230px。
   宽度 = 轨道总宽 + 左右 padding(12px), 固定后 margin auto 居中。 */
.g2048-grid {
  display: grid;
  gap: 6px;
  background: rgba(10, 10, 13, 0.8);
  border: 1px solid var(--c-line);
  padding: 6px;
}

.g2-4 { grid-template-columns: repeat(4, 50px); width: 230px; margin: 0 auto; }
.g2-5 { grid-template-columns: repeat(5, 39px); width: 231px; margin: 0 auto; }
.g2-6 { grid-template-columns: repeat(6, 32px); width: 234px; margin: 0 auto; }

.g2048-cell {
  aspect-ratio: 1;
  background: rgba(24, 24, 29, 0.9);
  color: var(--c-ink);
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}

.g2048-t2 { background: rgba(50, 50, 58, 0.9); }
.g2048-t4 { background: rgba(70, 66, 60, 0.9); }
.g2048-t8 { background: rgba(110, 66, 46, 0.9); }
.g2048-t16 { background: rgba(130, 60, 42, 0.9); }
.g2048-t32 { background: rgba(150, 50, 40, 0.9); }
.g2048-t64 { background: rgba(170, 44, 38, 0.9); }
.g2048-t128 { background: rgba(180, 70, 30, 0.95); }
.g2048-t256 { background: rgba(190, 100, 20, 0.95); }
.g2048-t512 { background: rgba(200, 130, 10, 0.95); }
.g2048-t1024 { background: rgba(210, 160, 0, 0.95); }
.g2048-t2048 { background: rgba(220, 190, 0, 0.95); }

/* ---- 贪吃蛇 ---- */
/* 难点: 与扫雷/2048 同理, canvas 需缩到不超出游戏外框(内容区底部约 312px),
   16 格×14px = 224px 逻辑(屏幕约145px) + 顶部 game-bar 正好放下。
   居中方式同 2048: 固定宽度 + margin:0 auto(AUI 父容器 align-items 不生效)。
   canvas 是 inline 元素必须 display:block, 否则 margin auto 不生效。 */
.snake-canvas {
  display: block;
  width: 224px;
  height: 224px;
  margin: 0 auto;
  border: 1px solid var(--c-line-2);
  background: #2c2c2f;
  image-rendering: pixelated;
}


/* ---- 排行榜 ---- */
.lb-row {
  display: flex;
  align-items: center;
  gap: 14px;
  border: 1px solid var(--c-line);
  background: var(--c-panel);
  padding: 10px 16px;
  margin-bottom: 8px;
}

.lb-me {
  border-color: var(--c-red-line);
  background: var(--c-red-soft);
}

.lb-rank {
  flex: 0 0 26px;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-muted);
  text-align: center;
}

.lb-rank-top {
  color: var(--c-red);
}

.lb-name {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  color: var(--c-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lb-score {
  flex: 0 0 auto;
  font-size: 12px;
  color: var(--c-muted);
  font-variant-numeric: tabular-nums;
}

.lb-empty {
  padding: 24px 0;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--c-faint);
}

/* ---- Modal ---- */
.modal-backdrop {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background: rgba(5, 5, 8, 0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-backdrop.open { display: flex; }

.modal-dismiss { position: absolute; inset: 0; }

.ctrl-modal {
  position: relative;
  z-index: 1;
  width: 400px;
  max-width: 92%;
  background: #2c2c2f;
  border: 1px solid var(--c-line-2);
  border-top: 2px solid var(--c-red);
}

.icon-picker-modal {
  width: 560px;
  max-width: 94%;
}

.modal-head {
  padding: 15px 20px;
  border-bottom: 1px solid var(--c-line);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.24em;
  color: var(--c-ink);
}

.modal-body { padding: 20px; }

.modal-label {
  display: block;
  margin-bottom: 7px;
  font-size: 10px;
  letter-spacing: 0.26em;
  color: var(--c-muted);
}

.modal-input {
  width: 100%;
  /* content-box 下 width:100% 会额外加上 padding/border 向右溢出, 必须 border-box */
  box-sizing: border-box;
  border: 1px solid var(--c-line-2);
  background: #1d1d1f;
  color: var(--c-ink);
  font-size: 13px;
  padding: 9px 12px;
  letter-spacing: 0.04em;
}

.modal-input:focus {
  outline: none;
  border-color: var(--c-red);
}

.modal-help {
  margin-top: 9px;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--c-faint);
}

.modal-foot {
  padding: 14px 20px;
  border-top: 1px solid var(--c-line);
  display: flex;
  /* 修复按钮文本偏上: flex 默认 stretch 把按钮拉高, content 盒被拉伸
     后 AUI 行盒垂直定位错位(实测 content 高 23.5 vs 正常 11.7),
     改为 center 让按钮保持自然行高 */
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
}

.modal-foot-split {
  justify-content: flex-start;
}

.modal-btn {
  border: 1px solid var(--c-line-2);
  background: transparent;
  color: var(--c-muted);
  font-size: 12px;
  letter-spacing: 0.2em;
  /* AUI 中较大 letter-spacing + 窄按钮会把短文本折行(实测「搜索」被折成两行,
     content 高 23.5 vs 单行 11.7, 字形错位偏上), nowrap 强制单行 */
  white-space: nowrap;
  padding: 8px 20px;
  cursor: pointer;
}

.modal-btn:hover { border-color: var(--c-ink); color: var(--c-ink); }

.modal-btn-primary {
  border-color: var(--c-red);
  background: var(--c-red);
  color: #ffffff;
}

.modal-btn-primary:hover {
  background: #d6333a;
  border-color: #d6333a;
}

/* 解散等危险操作按钮 */
.modal-btn-danger {
  border: 1px solid var(--c-red);
  background: transparent;
  color: var(--c-red);
}

.modal-btn-danger:hover {
  background: var(--c-red);
  color: #ffffff;
}

.foot-spacer {
  flex: 1;
}

.form-row {
  margin-bottom: 14px;
}

/* ---- 头像选择行(新建/设置) ---- */
.avatar-pick-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.room-avatar-box {
  width: 40px;
  height: 40px;
  border: 1px solid var(--c-line-2);
  background: var(--c-panel-2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* AUI <texture> 房间头像(物品图标):必须给宽高,引擎才渲染 */
.room-avatar-box texture {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ---- 物品图标选择器 ---- */
.icon-search-row {
  display: flex;
  /* 同 modal-foot: 避免 stretch 拉高按钮导致文本偏上 */
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.icon-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  max-height: 300px;
  /* 滚动条隐藏同 .page-content */
  overflow-y: hidden;
}

.icon-cell {
  border: 1px solid var(--c-line);
  background: var(--c-panel);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1;
}

.icon-cell:hover {
  border-color: var(--c-red-line);
}

.icon-cell-box {
  position: relative;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-cell-text {
  font-size: 12px;
  color: var(--c-ink);
}

/* AUI <texture> 物品图标:必须给宽高,引擎才渲染 */
.icon-cell-box texture {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.icon-cell-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.icon-pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 14px;
}

/* ---- 响应式 ---- */
/* 中等窗口:平板等比缩小,保持平板造型(不覆盖全屏)
   难点(2026-08 内容缩放): meta zoom=0.667 后游戏内逻辑视口宽为 640/0.667≈960,
   原 max-width:1120px 会被游戏误命中(stage padding 导致平板偏移)。阈值改为 940px
   避开 960, 该规则仅浏览器预览中等窗口生效。 */
@media (max-width: 940px) and (min-width: 701px) {
  .phone-stage { padding: 28px; }
  .tablet { zoom: 0.82; }
}

/* 难点: 曾有一个 @media (max-width:700px) 将 tablet 设为 width:100%;height:100vh 占满全屏。
   AUI viewport 固定 640px 宽, 会命中该媒体查询导致手机界面在游戏内被撑满全屏(实测 618x348),
   与设计的外框平板(500x300)不符。已删除该全屏覆盖, tablet 始终保持外框尺寸。 */
@media (max-width: 560px) {
  .side-nav { flex-basis: 64px; width: 64px; }
  .side-item { height: 58px; }
  .home-hero { padding: 32px 24px; }
  .home-time { font-size: 46px; }
  .home-stats { gap: 28px; }
  .page-head { padding: 16px 18px 12px; }
  .page-content { padding: 8px 18px 20px; }
  .chat-messages { padding: 14px 16px; }
  .head-title { font-size: 20px; }
}

/* ============================================================
   游戏内可读性放大(外框 tablet/device 尺寸不变)
   背景: AUI viewport 1200x700 缩放到游戏内约 0.5x,原 8-13px 字号
         显示后仅 4-6px 过小过糊。此处放大内部字号、元素并压缩间距,
         让内容在外框内更饱满、清晰,同时缓解"元素分散太开"。
   ============================================================ */

/* ---- 系统栏 ---- */
.sys-bar { flex-basis: 24px; height: 24px; font-size: 13px; }
.sys-dot { width: 6px; height: 6px; }

/* ---- 侧边导航 ---- */
.side-nav { flex-basis: 58px; width: 58px; }
/* 5 个按钮均分侧边栏高度(不留空), flex:1 替代固定 76px */
.side-item { flex: 1 1 0%; height: auto; min-height: 0; gap: 3px; }
.side-glyph { font-size: 30px; }
.side-label { font-size: 15px; }
.nav-badge { min-width: 14px; height: 14px; font-size: 10px; line-height: 14px; }

/* ---- 页头 ---- */
.page-head { padding: 10px 16px 8px; gap: 10px; }
.head-title { font-size: 27px; }
.head-kicker { font-size: 11px; }
.head-sub { font-size: 13px; }
.head-btn { font-size: 13px; padding: 6px 14px; }

/* ---- 通用 ---- */
.page-content { padding: 12px 16px 16px; }
.page-hint { font-size: 12px; }
.ctrl-tag { font-size: 12px; min-width: 24px; padding: 2px 8px; line-height: 18px; }
.badge { font-size: 12px; padding: 3px 9px; }

/* ---- 通讯 tab / 列表 ---- */
.comm-tab { font-size: 13px; padding: 8px 16px; }
.panel-kicker { font-size: 11px; }
.section-head { font-size: 14px; }
.section { gap: 6px; }
.ctrl-list { gap: 6px; }
